name: Deploy Producao

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Conecta na EC2 e faz o deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY_PROD }}
          script: |
            if [ -d "/home/ec2-user/app/.git" ]; then
              cd /home/ec2-user/app
              git checkout main
              git pull origin main
            else
              git clone -b main https://github.com/PedroDelmiro13/devops-challenge.git /home/ec2-user/app
              cd /home/ec2-user/app
            fi
            docker build -t lacrei-app:prod .
            docker stop lacrei-app || true
            docker rm lacrei-app || true
            docker run -d --name lacrei-app -p 3000:3000 --restart unless-stopped lacrei-app:prod